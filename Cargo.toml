[package]
name    = "qbot"
version = "0.14.0"
edition = "2021"

[[bin]]
name = "qbot"
path = "src/main.rs"

[lib]
name = "qbot"
path = "src/lib.rs"

[dependencies]
serenity           = { version = "0.12.5", default-features = false, features = ["client", "cache", "gateway", "rustls_backend", "model"] }
tokio              = { version = "1.0",                              features = ["macros", "rt-multi-thread", "signal"] }                  
sqlx               = { version = "0.8.2",                            features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }  
chrono             = { version = "0.4",                              features = ["serde"] }                                                
serde              = { version = "1.0",                              features = ["derive"] }                                               
uuid               = { version = "1.0",                              features = ["v4"] }                                                   
tracing-subscriber = { version = "0.3",                              features = ["time", "local-time", "ansi", "json", "env-filter"] }     
tracing-appender   = "0.2"                                                                                                                 
time               = { version = "0.3",                              features = ["macros"] }                                               
serde_json         = "1.0"   
anyhow             = "1.0"   
thiserror          = "2.0.12"
rand               = "0.10.0"
tracing            = "0.1"   
dotenvy            = "0.15"  
itertools          = "0.14.0"
async-trait        = "0.1"   
lazy_static        = "1.4"   
rustyline          = "18.0.0"
eframe             = "0.34"  
winit              = { version = "0.30", features = ["x11"] }
egui               = "0.34"  
egui-phosphor      = "0.12"  