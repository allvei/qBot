[package]
name    = "pf_pug_bot"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "pf_pug_bot"
path = "src/main.rs"

[lib]
name = "pf_pug_bot"
path = "src/lib.rs"

[dependencies]
serenity           = { version = "0.12.5", default-features = false, features = ["client", "cache", "gateway", "rustls_backend", "model"] } 
tokio              = { version = "1.0",                               features = ["macros", "rt-multi-thread", "signal"] }                  
sqlx               = { version = "0.8.6",                             features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }  
chrono             = { version = "0.4",                               features = ["serde"] }                                                
serde              = { version = "1.0",                               features = ["derive"] }                                               
uuid               = { version = "1.0",                               features = ["v4"] }                                                   
tracing-subscriber = { version = "0.3",                               features = ["time", "local-time", "ansi"] }                           
time               = { version = "0.3",                               features = ["macros"] }                                               
serde_json         = "1.0"   
anyhow             = "1.0"   
thiserror          = "2.0.12"
rand               = "0.9.1" 
tracing            = "0.1"   
dotenvy            = "0.15"  
itertools          = "0.14.0"
async-trait        = "0.1"   
lazy_static        = "1.4"   
rustyline          = "17.0.2"

[lints.rust]
# missing_docs_in_private_items = "warn"
# arbitrary_source_item_ordering = "warn"
# unused_imports     = "allow"
# dead_code          = "allow"
# unused_must_use    = "allow"
# unused_variables   = "allow"
deprecated = "allow"

[lints.clippy]
# pedantic = "warn"
# uninlined_format_args = "warn"