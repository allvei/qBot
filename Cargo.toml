[package]
name = "pfpug"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pfpug"
path = "src/main.rs"

[lib]
name = "pfpug"
path = "src/lib.rs"

[dependencies]
serenity = { version = "0.12", default-features = false, features = ["client", "cache", "gateway", "rustls_backend", "model"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rand = "0.9.1"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
uuid = { version = "1.0", features = ["v4"] }

[lints.clippy]
# missing_docs_in_private_items = "warn"
non_upper_case_globals = "allow"
non_camel_case_types = "allow"
# arbitrary_source_item_ordering = "warn"